<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halim Yönetici</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='stil.css') }}">
</head>
<body>
<header class="ust-bant">
  <a class="marka" href="{{ url_for('admin_giris') }}"><img src="{{ url_for('static', filename='logo.svg') }}" alt="Halim logosu"><b>Halim</b><small>Program yöneticisi</small></a>
  <form method="post" action="{{ url_for('admin_cikis') }}"><button class="ikincil">Çıkış yap</button></form>
</header>
<main>
  {% for tur, mesaj in get_flashed_messages(with_categories=true) %}<div class="bildirim {{ tur }}">{{ mesaj }}</div>{% endfor %}
  {% block icerik %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='ekran.js') }}"></script>
</body>
</html>
