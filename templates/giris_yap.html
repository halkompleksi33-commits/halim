<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halim</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='stil.css') }}">
</head>
<body>
<main class="giris-sayfa">
  <form method="post" class="giris-kutu">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="Halim logosu" width="96" height="96">
    <h1>Halim</h1>
    <p class="aciklama">Halde her hesabın yanında. Devam etmek için giriş yap.</p>
    {% for tur, mesaj in get_flashed_messages(with_categories=true) %}<div class="bildirim {{ tur }}" role="alert">{{ mesaj }}</div>{% endfor %}
    {% if hata %}<div class="bildirim hata" role="alert">{{ hata }}</div>{% endif %}
    <label>Kullanıcı adı<input name="kullanici" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Şifre<input type="password" name="sifre" autocomplete="current-password" required></label>
    <button class="ana-dugme">Giriş yap</button>
  </form>
</main>
</body>
</html>
